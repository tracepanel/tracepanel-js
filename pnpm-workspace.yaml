# New releases stay out for 48 hours before they resolve here (pnpm minimumReleaseAge), the window the other
# tracepanel repositories use too.
minimumReleaseAge: 2880
# esbuild (vitest's bundler) checks its platform binary after install.
allowBuilds:
  esbuild: true
  # The tests' SQLite driver: its prebuilt binary for this Node, or built from source.
  better-sqlite3: true
  # BullMQ's msgpackr (the tests' BullMQ) works without its native extract: nothing to build.
  msgpackr-extract: false
  # Apollo Server's (the tests' GraphQL server) protobufjs: its script only prints a notice.
  "@apollo/protobufjs": false
# Tracepanel's own packages (the agent's binaries) are released with this one.
minimumReleaseAgeExclude:
  - "@tracepanel/*"
