name: Fallow

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: fallow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fallow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Analyze changed code
        uses: fallow-rs/fallow@v3
        with:
          command: audit
          fail-on-issues: false
