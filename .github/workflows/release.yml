name: Release

# A tag that names a version (0.2.0, as in package.json) publishes it to npm. Nothing else does. It goes out once CI
# has passed on the tagged commit (the run main's push made), through npm's trusted publishing: the package trusts
# this repository, release.yml and the environment npm, so no token lives here. An NPM_TOKEN secret, if set, is used
# instead: the package's first version needs it (a package must exist before it can trust a workflow), or a
# maintainer publishes that one by hand.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  ci:
    name: CI passed on this commit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 120); do
            result=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push" \
              --jq '.workflow_runs[0] | "\(.status) \(.conclusion)"')
            case "$result" in
              "completed success") echo "CI passed on $GITHUB_SHA" && exit 0 ;;
              completed*) echo "::error::CI on $GITHUB_SHA: $result" && exit 1 ;;
              "null null") [ "$attempt" -ge 10 ] && echo "::error::no CI run of main on $GITHUB_SHA" && exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::CI on $GITHUB_SHA still runs" && exit 1

  publish:
    name: Publish to npm
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/@tracepanel/js
    permissions:
      contents: read
      # What npm's trusted publishing and provenance sign the upload with, in place of a token.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: npm with trusted publishing (11.5.1 or later)
        run: npm install --global npm@^11.15.0
      # A minor is released with the agent's, a patch on its own: the agent is pinned to this version's minor (~0.3.1).
      - name: The tag is the version, and the agent's pin is its minor
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync } from "node:fs";
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          const tag = process.env.GITHUB_REF_NAME;
          const agent = pkg.dependencies["@tracepanel/agent"];
          const minor = (version) => version.split(".").slice(0, 2).join(".");
          const pinned = /^~(\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?)$/.exec(agent);
          if (pkg.version !== tag || !pinned || minor(pinned[1]) !== minor(tag)) {
            console.log(`::error::tag ${tag}, version ${pkg.version}, agent ${agent}: the tag must be the version, the agent ~${minor(tag)}.N`);
            process.exit(1);
          }
          EOF
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # A pre-release (0.2.0-beta.1) goes under its own dist-tag, so `npm install @tracepanel/js` keeps the latest release.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) tag=$(echo "${GITHUB_REF_NAME#*-}" | cut -d. -f1) ;;
            *) tag=latest ;;
          esac
          # Already there (published by hand, or a run retried): nothing to do, as npm won't take a version twice.
          name=$(node -p 'require("./package.json").name')
          if [ "$(npm view "$name@$GITHUB_REF_NAME" version 2>/dev/null)" = "$GITHUB_REF_NAME" ]; then
            echo "::notice::$GITHUB_REF_NAME is on npm already"
            exit 0
          fi
          npm publish --access public --tag "$tag" --provenance
          echo "::notice::$GITHUB_REF_NAME is on npm"
