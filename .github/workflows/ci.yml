name: CI

# Lint, types, the unit tests and the build, on every Node.js the package supports, and the build loaded by Bun. The
# live tests run too, on a Postgres (EXPLAIN, transactions) and a Redis (BullMQ) of their own.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["20.19", "22", "24", "26"]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: shop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shop" --health-interval 2s --health-timeout 5s --health-retries 15
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
        env:
          TRACEPANEL_TEST_POSTGRES: postgres://shop:secret@127.0.0.1:5432/shop
          TRACEPANEL_TEST_REDIS: redis://127.0.0.1:6379
      - run: pnpm build
      # What `node --import @tracepanel/js/register` loads: it must start without the app.
      - run: node --input-type=module -e "await import('./dist/register.js'); console.log('register loads')"

  bun:
    name: Bun
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: bun --preload ./dist/register.js -e "const { withTracepanel } = await import('./dist/bun.js'); console.log(typeof withTracepanel)"
      # Bun has no inspector to profile with: the hello offers no profile, neither the time nor the memory.
      - run: |
          bun -e "
            const { hello } = await import('./dist/agent.js');
            const { loadConfig } = await import('./dist/config.js');
            const can = hello(loadConfig({ TRACEPANEL_PROFILE_MEMORY: '1' })).capabilities;
            console.log(can);
            if (can.some((name) => name.startsWith('profile'))) process.exit(1);
          "
      # Bun.serve's own requests: their bodies read through the tap, the handler getting every byte.
      - run: bun test/bun/body.ts
