name: CI

# Lint, types, the unit tests and the build, on every Node.js the package supports, and the build loaded by Bun. The
# live tests run too, on a Postgres (EXPLAIN, transactions) and a Redis (BullMQ) of their own.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # paths-filter lists a pull request's files through the API.
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.code.outputs.code == 'true' }}
    steps:
      # A pull request that changes only the pages (the README and its images, the changelog) or the license tests
      # nothing. Node's jobs are required checks under their matrix names: they still run, each step skipped, so the
      # checks pass. Bun's, skipped whole, counts as passed.
      - if: github.event_name == 'pull_request'
        id: code
        uses: dorny/paths-filter@v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - "**"
              - "!**/*.md"
              - "!LICENSE"
              - "!docs/**"
              - "!assets/**"

  node:
    name: Node ${{ matrix.node }}
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["20.19", "22", "24", "26"]
    services:
      postgres:
        image: ${{ needs.changes.outputs.code == 'true' && 'postgres:18-alpine' || '' }}
        env:
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: shop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shop" --health-interval 2s --health-timeout 5s --health-retries 15
      redis:
        image: ${{ needs.changes.outputs.code == 'true' && 'redis:8-alpine' || '' }}
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 5s --health-retries 15
    steps:
      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v7
        with:
          # fallow audit diffs a change against its base; the walk needs both ends.
          fetch-depth: 0
      - if: needs.changes.outputs.code == 'true'
        uses: pnpm/action-setup@v6
      - if: needs.changes.outputs.code == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - if: needs.changes.outputs.code == 'true'
        run: pnpm install --frozen-lockfile
      - if: needs.changes.outputs.code == 'true'
        run: pnpm lint
      # Unused code, complexity and duplication: only what this change adds fails it. Once, on one Node.
      - if: needs.changes.outputs.code == 'true' && matrix.node == '24'
        name: fallow finds only what this change adds
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        # A new tag (the release runs this) has no base: its "before" is all zeros. Then the commit before this one.
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2> /dev/null; then BASE=HEAD~1; fi
          pnpm exec fallow audit --base "$BASE"
      - if: needs.changes.outputs.code == 'true'
        run: pnpm test
        env:
          TRACEPANEL_TEST_POSTGRES: postgres://shop:secret@127.0.0.1:5432/shop
          TRACEPANEL_TEST_REDIS: redis://127.0.0.1:6379
      - if: needs.changes.outputs.code == 'true'
        run: pnpm build
      # What `node --import @tracepanel/js/register` loads: it must start without the app.
      - if: needs.changes.outputs.code == 'true'
        run: node --input-type=module -e "await import('./dist/register.js'); console.log('register loads')"

  bun:
    name: Bun
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: bun --preload ./dist/register.js -e "const { withTracepanel } = await import('./dist/bun.js'); console.log(typeof withTracepanel)"
      # Bun has no inspector to profile with: the hello offers no profile, neither the time nor the memory.
      - run: |
          bun -e "
            const { hello } = await import('./dist/agent.js');
            const { loadConfig } = await import('./dist/config.js');
            const can = hello(loadConfig({ TRACEPANEL_PROFILE_MEMORY: '1' })).capabilities;
            console.log(can);
            if (can.some((name) => name.startsWith('profile'))) process.exit(1);
          "
      # Bun.serve's own requests: their bodies read through the tap, the handler getting every byte.
      - run: bun test/bun/body.ts
      # Hono on Bun: its middleware names the route, serve() marks the response once.
      - run: bun test/bun/hono.ts
      # Drizzle's queries on Bun, whose stacks have no async frames: made where the app called Drizzle.
      - run: bun test/bun/queries.ts

  # @tracepanel/js/angular on each Angular it supports: zoneless and on Zone.js, HttpClient on fetch and on XHR, an
  # NgModule app, the server and a production build.
  angular:
    name: Angular ${{ matrix.angular }}
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { angular: "20.0", zone: "~0.15.1" }
          - { angular: "20.3", zone: "~0.15.1" }
          - { angular: "21", zone: "~0.15.1" }
          - { angular: "22", zone: "~0.16.3" }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Angular ${{ matrix.angular }}
        run: >-
          pnpm add -D
          @angular/common@${{ matrix.angular }} @angular/compiler@${{ matrix.angular }}
          @angular/core@${{ matrix.angular }} @angular/platform-browser@${{ matrix.angular }}
          @angular/router@${{ matrix.angular }} zone.js@${{ matrix.zone }}
      - name: Zoneless, its lifecycle, an NgModule app, the server and a production build
        run: pnpm exec vitest run test/angular.test.ts test/angular-production.test.ts test/angular-lifecycle.test.ts test/angular-ngmodule.test.ts
      - name: HttpClient on XHR
        run: pnpm exec vitest run test/angular.test.ts
        env:
          TRACEPANEL_ANGULAR_HTTP: xhr
      - name: On Zone.js, an NgModule app too
        run: pnpm exec vitest run test/angular.test.ts test/angular-ngmodule.test.ts
        env:
          TRACEPANEL_ANGULAR_ZONE: "1"
      - name: XHR on Zone.js
        run: pnpm exec vitest run test/angular.test.ts
        env:
          TRACEPANEL_ANGULAR_ZONE: "1"
          TRACEPANEL_ANGULAR_HTTP: xhr
